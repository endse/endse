name: Refresh profile graphics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate local GitHub stats and language cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_stats.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: endse
          outputs: |
            assets/contribution-snake.svg?palette=github-dark

      - name: Commit refreshed images to the main branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh GitHub profile graphics"
          file_pattern: "assets/*.svg"

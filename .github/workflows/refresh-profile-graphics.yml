name: Refresh profile graphics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *" # daily
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-profile-graphics.yml"

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate hero banner
        run: python scripts/generate_hero.py

      - name: Generate stats and language cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_stats.py

      - name: Generate growing contribution snake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_snake.py

      - name: Commit refreshed graphics
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh GitHub profile graphics"
          file_pattern: "assets/*.svg"

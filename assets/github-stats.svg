<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="~/github-stats">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#161137"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.in{animation:in .8s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.live{animation:blink 2s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="519" height="199" rx="14" fill="url(#bg)" stroke="#2d3359"/>
<rect x="24" y="47" width="60" height="2" rx="1" fill="url(#accent)"/>
<text x="24" y="34" fill="#e6edf3" font-size="14" font-weight="700" class="mono">~/github-stats</text>
<circle cx="408" cy="30" r="3.5" fill="#3fb950" class="live"/>
<text x="496" y="34" text-anchor="end" fill="#7d8590" font-size="10.5" class="mono">auto-updated</text>
<g class="in" style="animation-delay:0.00s"><rect x="24" y="66" width="106" height="86" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06"/><text x="77" y="112" text-anchor="middle" fill="url(#accent)" font-size="28" font-weight="800">16</text><text x="77" y="136" text-anchor="middle" fill="#8b949e" font-size="11">public repos</text></g><g class="in" style="animation-delay:0.12s"><rect x="142" y="66" width="106" height="86" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06"/><text x="195" y="112" text-anchor="middle" fill="url(#accent)" font-size="28" font-weight="800">1</text><text x="195" y="136" text-anchor="middle" fill="#8b949e" font-size="11">stars earned</text></g><g class="in" style="animation-delay:0.24s"><rect x="260" y="66" width="106" height="86" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06"/><text x="313" y="112" text-anchor="middle" fill="url(#accent)" font-size="28" font-weight="800">2</text><text x="313" y="136" text-anchor="middle" fill="#8b949e" font-size="11">followers</text></g><g class="in" style="animation-delay:0.36s"><rect x="378" y="66" width="106" height="86" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06"/><text x="431" y="112" text-anchor="middle" fill="url(#accent)" font-size="28" font-weight="800">1,154</text><text x="431" y="136" text-anchor="middle" fill="#8b949e" font-size="11">contributions</text></g><text x="260" y="180" text-anchor="middle" fill="#6e7681" font-size="10.5" class="mono">endse + Endsett · 1 forks · contributions = last 12 months</text>
</svg>